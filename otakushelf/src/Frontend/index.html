<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <!-- ── Primary Meta Tags ── -->

  <meta name="description" content="Create your free anime list and track every series you watch. Rate anime, write reviews, earn badges, and import your MyAnimeList library today." />

  <!-- ── Structured Data: WebSite + SearchAction ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "AnimeRegistry",
    "url": "https://animeregistry.com/",
    "description": "Free anime list and anime tracker platform. Build your watchlist, track episodes, rate anime, write reviews, earn badges and import your MyAnimeList library.",
    "inLanguage": "en-US",
    "publisher": {
      "@type": "Organization",
      "name": "AnimeRegistry",
      "logo": {
        "@type": "ImageObject",
        "url": "https://animeregistry.com/animeregistrylogo.png"
      }
    },
    "potentialAction": {
      "@type": "SearchAction",
      "target": {
        "@type": "EntryPoint",
        "urlTemplate": "https://animeregistry.com/?q={search_term_string}"
      },
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- ── Structured Data: Organization ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "AnimeRegistry",
    "url": "https://animeregistry.com/",
    "logo": "https://animeregistry.com/animeregistrylogo.png",
    "contactPoint": {
      "@type": "ContactPoint",
      "email": "animeregistryofficial@gmail.com",
      "contactType": "customer support"
    }
  }
  </script>

  <!-- ── Structured Data: WebApplication ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "AnimeRegistry",
    "url": "https://animeregistry.com/",
    "applicationCategory": "EntertainmentApplication",
    "operatingSystem": "Web",
    "browserRequirements": "Requires JavaScript",
    "inLanguage": "en-US",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "featureList": [
      "anime list",
      "anime tracker",
      "anime watchlist",
      "anime database",
      "anime catalog",
      "anime ratings",
      "anime reviews",
      "anime recommendations",
      "episode progress tracking",
      "anime statistics",
      "achievements and badges",
      "MyAnimeList import"
    ]
  }
  </script>

  <!-- ── Structured Data: FAQ ── -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "FAQPage",
    "mainEntity": [
      {
        "@type": "Question",
        "name": "What is AnimeRegistry?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "AnimeRegistry is a modern, free anime list and anime tracker. You can build a watchlist, log episode progress, rate and review shows, earn achievements and badges, and browse a large catalog of anime."
        }
      },
      {
        "@type": "Question",
        "name": "How do I create an anime list?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Create a free account, open any anime in the catalog and choose a list status such as Watching, Completed, Planned, Paused or Dropped. Your list is saved to your profile and synced across your devices."
        }
      },
      {
        "@type": "Question",
        "name": "Is AnimeRegistry free?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. AnimeRegistry is completely free to use — creating an anime list, tracking progress, rating anime, writing reviews and earning badges cost nothing."
        }
      },
      {
        "@type": "Question",
        "name": "Can I import MyAnimeList?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. AnimeRegistry supports MyAnimeList import. You can upload your MAL export file and migrate your anime collection, ratings and history without starting from scratch."
        }
      },
      {
        "@type": "Question",
        "name": "How do anime badges work?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "AnimeRegistry rewards you with achievements and badges for watching anime, completing series, hitting watch-time milestones and more. Badges are collected on your profile as you unlock them."
        }
      },
      {
        "@type": "Question",
        "name": "Can I track episode progress?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. You can log the exact episode you are on for every series, including currently airing shows, so your anime progress tracker is always up to date."
        }
      },
      {
        "@type": "Question",
        "name": "Does AnimeRegistry work on mobile?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. AnimeRegistry is a mobile-friendly web app with a dedicated bottom navigation bar, so you can manage your anime list on your phone or tablet just as easily as on desktop."
        }
      },
      {
        "@type": "Question",
        "name": "Is my anime list synchronized?",
        "acceptedAnswer": {
          "@type": "Answer",
          "text": "Yes. Your anime list, ratings and progress are stored in the cloud and synced across devices, so signing in anywhere gives you the same up-to-date anime collection."
        }
      }
    ]
  }
  </script>
